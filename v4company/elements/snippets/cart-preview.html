<div class="plugoo-cart-preview-sidebar flex flex-column">
    <div class="header-cart flex align-center">
        <div class="pg-return-cart">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12h-15m0 0l6.75 6.75M4.5 12l6.75-6.75" />
            </svg>
        </div>
        <div class="text">Carrinho de compras</div>
    </div>
    <div class="cart-preview-content flex-grow flex flex-column justify-between empty">
        <div class="list">
            <div class="error">
                <div clas="text">Seu carrinho está vazio</div>
            </div>
        </div>
        <div class="flex justify-center align-center">
            <button class="clean-cart btn">
                <span>Limpar carrinho</span>
            </button>
        </div>
    </div>
    {% element 'snippets/progress-bars' %}
    <div class="cart-preview-footer">
        <div class="total flex align-center "><span>Subtotal:</span> <span class="value"></span></div>
        <div class="cart-preview-footer-actions">
            <a href="/checkout?session_id=hh393f6ujbai48lakejd2qfeb6&store_id={{ store.id }}" class="botao-commerce buy flex align-center">
                <span class="text">Finalizar compra</span>
            </a>
        </div>
    </div>
</div> 
<div class="shadow-cart"></div>
