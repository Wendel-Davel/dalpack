<section class="s-newsletter" style="order: 9">
  <div class="container">
    <div class="topo">
      <h2>Cadastre-se e aproveite as promoções exclusivas</h2>
    </div>
    <div class="down">
      <div class="photo">
        <img src=" {{ asset(settings['imagem_banner_newsletter']) }}" alt="" />
      </div>

      <div class="right">
        <form class="form" action="/mvc/store/newsletter/" method="post">
          <input type="hidden" name="loja" value="{{ store.id }}" />
          <div class="cont-form">
            <h3>Nome</h3>
            <div class="cont-input">
              <div class="icone">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="M13.3333 14V12.6667C13.3333 11.9594 13.0523 11.2811 12.5522 10.781C12.0521 10.281 11.3739 10 10.6666 10H5.33329C4.62605 10 3.94777 10.281 3.44767 10.781C2.94758 11.2811 2.66663 11.9594 2.66663 12.6667V14M10.6666 4.66667C10.6666 6.13943 9.47272 7.33333 7.99996 7.33333C6.5272 7.33333 5.33329 6.13943 5.33329 4.66667C5.33329 3.19391 6.5272 2 7.99996 2C9.47272 2 10.6666 3.19391 10.6666 4.66667Z"
                    stroke="#6B7280"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <input
                id="news-name"
                class="field"
                name="name"
                type="text"
                placeholder="Nome"
                required
              />
            </div>
          </div>
          <div class="cont-form">
            <h3>Email</h3>
            <div class="cont-input">
              <div class="icone">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="M14.6667 3.99984C14.6667 3.2665 14.0667 2.6665 13.3334 2.6665H2.66671C1.93337 2.6665 1.33337 3.2665 1.33337 3.99984M14.6667 3.99984V11.9998C14.6667 12.7332 14.0667 13.3332 13.3334 13.3332H2.66671C1.93337 13.3332 1.33337 12.7332 1.33337 11.9998V3.99984M14.6667 3.99984L8.00004 8.6665L1.33337 3.99984"
                    stroke="#9CA3AF"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <input
                type="email"
                class="field"
                name="email"
                placeholder="Seu e-mail"
                required
                spellcheck="false"
                autocomplete="off"
              />
            </div>
          </div>

          <button
            type="submit"
            class="button news-button"
            title="Cadastrar"
            aria-label="Cadastrar"
          >
            <span>Cadastrar</span>
          </button>
          <div class="text">
            <p>
              Precisamos das informações de contato que você nos fornece para
              entrar em contato. Você pode deixar de receber essas comunicações
              quando quiser. Mais informações em
              <a href="/privacidade">Política de Privacidade</a>.
            </p>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
